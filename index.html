<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vision Pro AR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            position: fixed; top: 0; left: 0;
        }
        
        .camera-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; z-index: 1;
        }
        .cam-view {
            width: 50vw; height: 100vh;
            overflow: hidden; position: relative;
        }
        .cam-view video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        #render-canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 999; padding: 20px 40px; font-size: 20px; font-weight: bold;
            color: #fff; background: #007aff; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }

        #status-tag {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(0,0,0,0.7); color: #00ff00; font-weight: bold;
            padding: 8px 16px; border-radius: 20px; font-size: 14px;
            font-family: sans-serif; display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <button id="start-btn" onclick="startVisionAR()">비전프로 AR 실행</button>
    <div id="status-tag">손 찾는 중...</div>

    <div class="camera-container">
        <div class="cam-view"><video id="v-left" autoplay playsinline muted></video></div>
        <div class="cam-view"><video id="v-right" autoplay playsinline muted></video></div>
    </div>

    <canvas id="render-canvas"></canvas>

    <script>
        let scene, cameraLeft, cameraRight, renderer, hands;
        const joints = [];
        let skeletonLines = [];
        const appIcons = [];
        
        let isAppVisible = false;
        let lastFistState = false;
        let isProcessing = false;

        const videoLeft = document.getElementById('v-left');
        const videoRight = document.getElementById('v-right');
        const canvas = document.getElementById('render-canvas');
        const startBtn = document.getElementById('start-btn');
        const statusTag = document.getElementById('status-tag');

        const HAND_CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],
            [0,5], [5,6], [6,7], [7,8],
            [5,9], [9,10], [10,11], [11,12],
            [9,13], [13,14], [14,15], [15,16],
            [13,17], [0,17], [17,18], [18,19], [19,20]
        ];

        const appsData = [
            { name: "Safari", color: 0x007aff },
            { name: "Photos", color: 0xff3b30 },
            { name: "Music", color: 0xff2d55 },
            { name: "TV", color: 0x5856d6 },
            { name: "Settings", color: 0x8e8e93 },
            { name: "Notes", color: 0xffcc00 }
        ];

        async function startVisionAR() {
            startBtn.style.display = 'none';
            statusTag.style.display = 'block';

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (e) {}

            await initCamera();
            initThree();
            initMediaPipe();

            window.addEventListener('resize', updateLayout);
            window.addEventListener('orientationchange', () => setTimeout(updateLayout, 300));

            updateLayout();
            render();
        }

        async function initCamera() {
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
                });
            } catch (e) {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
            }

            videoLeft.srcObject = stream;
            videoRight.srcObject = stream;

            await videoLeft.play();
            await videoRight.play();
        }

        function initThree() {
            scene = new THREE.Scene();

            cameraLeft = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            cameraRight = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);

            cameraLeft.position.set(-0.1, 0, 5);
            cameraRight.position.set(0.1, 0, 5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);

            createAppGrid();

            const jointGeo = new THREE.SphereGeometry(0.08, 12, 12);
            const jointMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            for (let i = 0; i < 21; i++) {
                const joint = new THREE.Mesh(jointGeo, jointMat);
                joint.visible = false;
                scene.add(joint);
                joints.push(joint);
            }

            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
            HAND_CONNECTIONS.forEach(() => {
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
                const line = new THREE.Line(geometry, lineMat);
                line.visible = false;
                scene.add(line);
                skeletonLines.push(line);
            });
        }

        function updateLayout() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const halfWidth = w / 2;
            const aspect = halfWidth / h;

            if (renderer && cameraLeft && cameraRight) {
                renderer.setSize(w, h);
                
                cameraLeft.aspect = aspect;
                cameraLeft.updateProjectionMatrix();

                cameraRight.aspect = aspect;
                cameraRight.updateProjectionMatrix();
            }
        }

        function createAppGrid() {
            const cols = 3;
            const spacingX = 1.3;
            const spacingY = 1.2;

            appsData.forEach((app, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);

                const iconGeo = new THREE.CircleGeometry(0.4, 32);
                const iconMat = new THREE.MeshBasicMaterial({ 
                    color: app.color, 
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.85
                });
                const mesh = new THREE.Mesh(iconGeo, iconMat);

                const posX = (col - 1) * spacingX;
                const posY = 0.6 - (row * spacingY);
                mesh.position.set(posX, posY, -1.0);
                mesh.visible = false;

                scene.add(mesh);
                appIcons.push(mesh);
            });
        }

        async function render() {
            requestAnimationFrame(render);

            if (videoLeft.readyState >= 2 && hands && !isProcessing) {
                isProcessing = true;
                await hands.send({ image: videoLeft });
                isProcessing = false;
            }

            const w = window.innerWidth;
            const h = window.innerHeight;
            const halfW = w / 2;

            renderer.setScissorTest(true);

            // 좌측 눈
            renderer.setViewport(0, 0, halfW, h);
            renderer.setScissor(0, 0, halfW, h);
            renderer.render(scene, cameraLeft);

            // 우측 눈
            renderer.setViewport(halfW, 0, halfW, h);
            renderer.setScissor(halfW, 0, halfW, h);
            renderer.render(scene, cameraRight);

            renderer.setScissorTest(false);
        }

        // 거리 기반 유클리드 정밀 주먹 감지 알고리즘
        function checkIsFist(landmarks) {
            const wrist = landmarks[0];
            
            const distIndex = Math.hypot(landmarks[8].x - wrist.x, landmarks[8].y - wrist.y);
            const distMiddle = Math.hypot(landmarks[12].x - wrist.x, landmarks[12].y - wrist.y);
            const distRing = Math.hypot(landmarks[16].x - wrist.x, landmarks[16].y - wrist.y);

            const baseIndex = Math.hypot(landmarks[5].x - wrist.x, landmarks[5].y - wrist.y);

            return (distIndex < baseIndex * 1.2) && (distMiddle < baseIndex * 1.2) && (distRing < baseIndex * 1.2);
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusTag.innerText = "손 인식됨!";
                statusTag.style.color = "#00ff00";

                const landmarks = results.multiHandLandmarks[0];

                landmarks.forEach((lm, index) => {
                    const x = (0.5 - lm.x) * 6;
                    const y = (0.5 - lm.y) * 4;
                    const z = -lm.z * 5 - 1.0;

                    joints[index].position.set(x, y, z);
                    joints[index].visible = true;
                });

                HAND_CONNECTIONS.forEach((pair, index) => {
                    const p1 = joints[pair[0]].position;
                    const p2 = joints[pair[1]].position;

                    const positions = skeletonLines[index].geometry.attributes.position.array;
                    positions[0] = p1.x; positions[1] = p1.y; positions[2] = p1.z;
                    positions[3] = p2.x; positions[4] = p2.y; positions[5] = p2.z;

                    skeletonLines[index].geometry.attributes.position.needsUpdate = true;
                    skeletonLines[index].visible = true;
                });

                const isFist = checkIsFist(landmarks);

                if (isFist && !lastFistState) {
                    isAppVisible = !isAppVisible;
                    appIcons.forEach(icon => icon.visible = isAppVisible);
                }
                lastFistState = isFist;

            } else {
                statusTag.innerText = "손 찾는 중...";
                statusTag.style.color = "#ffaa00";
                joints.forEach(j => j.visible = false);
                skeletonLines.forEach(l => l.visible = false);
            }
        }

        function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);
        }
    </script>
</body>
</html>
