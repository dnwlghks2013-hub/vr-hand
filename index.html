<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionOS Exact System Architecture</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            position: fixed; top: 0; left: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }
        
        .camera-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; z-index: 1;
        }
        .cam-view { width: 50vw; height: 100vh; overflow: hidden; position: relative; }
        .cam-view video { width: 100%; height: 100%; object-fit: cover; }

        #render-canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        /* 비전프로 스타일 중앙 시선 커서 */
        #gaze-reticle {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 99; pointer-events: none;
            transition: transform 0.1s ease, background 0.1s ease;
        }
        #gaze-reticle.active {
            transform: translate(-50%, -50%) scale(1.4);
            background: rgba(0, 122, 255, 0.6);
            border-color: #007aff;
        }

        /* 윈도우 UI */
        #app-window {
            position: absolute; top: 10%; left: 15%;
            width: 70vw; height: 55vh;
            background: rgba(25, 25, 25, 0.75);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px);
            z-index: 10; display: none; flex-direction: column;
            overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        #window-bar {
            height: 48px; background: rgba(255,255,255,0.05);
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
        }
        #window-title { color: #fff; font-size: 15px; font-weight: 600; }
        #close-btn {
            background: rgba(255,255,255,0.2); color: #fff; border: none; width: 24px; height: 24px;
            border-radius: 50%; font-size: 12px; cursor: pointer;
        }

        #app-iframe { width: 100%; height: calc(100% - 48px); border: none; background: #fff; }

        /* 가상 키보드 */
        #vision-keyboard {
            position: absolute; bottom: 6%; left: 20%;
            width: 60vw; height: 26vh;
            background: rgba(30, 30, 30, 0.8);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(30px);
            z-index: 11; display: none; flex-direction: column;
            padding: 12px; gap: 8px;
        }
        .kb-row { display: flex; width: 100%; height: 23%; gap: 6px; }
        .kb-key {
            flex: 1; background: rgba(255,255,255,0.12); border-radius: 10px;
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 500;
        }

        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 999; padding: 20px 40px; font-size: 18px; font-weight: 600;
            color: #fff; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            border-radius: 30px; backdrop-filter: blur(20px); cursor: pointer;
        }

        #status-tag {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.6); color: #fff; padding: 8px 16px;
            border-radius: 20px; font-size: 13px; backdrop-filter: blur(10px);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <button id="start-btn" onclick="startVisionAR()">VisionOS 시작</button>
    <div id="status-tag">시선 추적 준비 중...</div>
    <div id="gaze-reticle"></div>

    <div class="camera-container">
        <div class="cam-view"><video id="v-left" autoplay playsinline muted></video></div>
        <div class="cam-view"><video id="v-right" autoplay playsinline muted></video></div>
    </div>

    <div id="app-window">
        <div id="window-bar">
            <span id="window-title">Safari</span>
            <button id="close-btn" onclick="closeApp()">✕</button>
        </div>
        <iframe id="app-iframe" src="about:blank"></iframe>
    </div>

    <div id="vision-keyboard">
        <div class="kb-row">
            <div class="kb-key">Q</div><div class="kb-key">W</div><div class="kb-key">E</div><div class="kb-key">R</div><div class="kb-key">T</div><div class="kb-key">Y</div><div class="kb-key">U</div><div class="kb-key">I</div><div class="kb-key">O</div><div class="kb-key">P</div>
        </div>
        <div class="kb-row">
            <div class="kb-key">A</div><div class="kb-key">S</div><div class="kb-key">D</div><div class="kb-key">F</div><div class="kb-key">G</div><div class="kb-key">H</div><div class="kb-key">J</div><div class="kb-key">K</div><div class="kb-key">L</div>
        </div>
        <div class="kb-row">
            <div class="kb-key">Z</div><div class="kb-key">X</div><div class="kb-key">C</div><div class="kb-key">V</div><div class="kb-key">B</div><div class="kb-key">N</div><div class="kb-key">M</div>
        </div>
        <div class="kb-row">
            <div class="kb-key" style="flex:4">Space</div>
            <div class="kb-key" onclick="toggleKeyboard(false)">닫기</div>
        </div>
    </div>

    <canvas id="render-canvas"></canvas>

    <script>
        let scene, cameraLeft, cameraRight, renderer, hands;
        const appIcons = [];
        let glassPanel = null;
        let raycaster, mouseCenter;
        let hoveredApp = null;
        let isPinching = false;
        let lastPinchTime = 0;
        let isAppOpen = false;

        const videoLeft = document.getElementById('v-left');
        const videoRight = document.getElementById('v-right');
        const canvas = document.getElementById('render-canvas');
        const startBtn = document.getElementById('start-btn');
        const statusTag = document.getElementById('status-tag');
        const reticle = document.getElementById('gaze-reticle');
        const appWindow = document.getElementById('app-window');
        const appIframe = document.getElementById('app-iframe');
        const windowTitle = document.getElementById('window-title');
        const keyboard = document.getElementById('vision-keyboard');

        const appsData = [
            { name: "Apple TV", color: 0x1c1c1e, url: "https://tv.apple.com" },
            { name: "Talk", color: 0xfee500, url: "https://www.kakaocorp.com" },
            { name: "YouTube", color: 0xff0000, url: "https://www.youtube.com/embed" },
            { name: "Camera", color: 0xd1d1d6, url: "#" },
            { name: "Phone", color: 0x34c759, url: "#" },
            { name: "Naver", color: 0x03cf5d, url: "https://m.naver.com" },
            { name: "Clock", color: 0xffffff, url: "#" },
            { name: "Safari", color: 0x007aff, url: "https://www.google.com" }
        ];

        async function startVisionAR() {
            startBtn.style.display = 'none';
            statusTag.style.display = 'block';

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (e) {}

            await initCamera();
            initThree();
            initMediaPipe();

            window.addEventListener('resize', updateLayout);
            updateLayout();
            render();
        }

        async function initCamera() {
            let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            videoLeft.srcObject = stream;
            videoRight.srcObject = stream;
            await videoLeft.play();
            await videoRight.play();
        }

        function initThree() {
            scene = new THREE.Scene();

            cameraLeft = new THREE.PerspectiveCamera(70, 1, 0.1, 1000);
            cameraRight = new THREE.PerspectiveCamera(70, 1, 0.1, 1000);
            cameraLeft.position.set(-0.1, 0, 5);
            cameraRight.position.set(0.1, 0, 5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);

            raycaster = new THREE.Raycaster();
            mouseCenter = new THREE.Vector2(0, 0); // 화면 중앙(시선)

            createHomeBoard();
        }

        function createHomeBoard() {
            // 비전프로 유리 홈 보드
            const panelGeo = new THREE.PlaneGeometry(4.4, 2.4);
            const panelMat = new THREE.MeshBasicMaterial({
                color: 0x111111, transparent: true, opacity: 0.5, side: THREE.DoubleSide
            });
            glassPanel = new THREE.Mesh(panelGeo, panelMat);
            glassPanel.position.set(0, 0, -1.5);
            scene.add(glassPanel);

            // 아이콘 2행 4열
            const cols = 4;
            const spacingX = 0.95;
            const spacingY = 0.85;

            appsData.forEach((app, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);

                const iconGeo = new THREE.PlaneGeometry(0.7, 0.7);
                const iconMat = new THREE.MeshBasicMaterial({ color: app.color, side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(iconGeo, iconMat);

                const posX = (col - 1.5) * spacingX;
                const posY = 0.4 - (row * spacingY);
                mesh.position.set(posX, posY, -1.45);
                mesh.userData = { ...app, originalScale: new THREE.Vector3(1, 1, 1) };

                scene.add(mesh);
                appIcons.push(mesh);
            });
        }

        function updateLayout() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            cameraLeft.aspect = (w / 2) / h;
            cameraRight.aspect = (w / 2) / h;
            cameraLeft.updateProjectionMatrix();
            cameraRight.updateProjectionMatrix();
        }

        async function render() {
            requestAnimationFrame(render);

            if (videoLeft.readyState >= 2 && hands) {
                await hands.send({ image: videoLeft });
            }

            // 시선(중앙) Raycasting 체크
            if (!isAppOpen) {
                raycaster.setFromCamera(mouseCenter, cameraLeft);
                const intersects = raycaster.intersectObjects(appIcons);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hoveredApp !== hit) {
                        if (hoveredApp) hoveredApp.scale.set(1, 1, 1);
                        hoveredApp = hit;
                        hoveredApp.scale.set(1.15, 1.15, 1.15); // 비전프로의 바라볼 때 응답(하이라이트 및 확대)
                        reticle.classList.add('active');
                    }
                } else {
                    if (hoveredApp) {
                        hoveredApp.scale.set(1, 1, 1);
                        hoveredApp = null;
                        reticle.classList.remove('active');
                    }
                }
            }

            const w = window.innerWidth;
            const h = window.innerHeight;
            const halfW = w / 2;

            renderer.setScissorTest(true);
            renderer.setViewport(0, 0, halfW, h);
            renderer.setScissor(0, 0, halfW, h);
            renderer.render(scene, cameraLeft);

            renderer.setViewport(halfW, 0, halfW, h);
            renderer.setScissor(halfW, 0, halfW, h);
            renderer.render(scene, cameraRight);
            renderer.setScissorTest(false);
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusTag.innerText = "손 추적 중 (핀치 제스처 준비)";
                const lm = results.multiHandLandmarks[0];

                // 엄지 손가락 끝(4번)과 검지 손가락 끝(8번) 거리를 이용한 Pinch 제스처 감지
                const thumbTip = lm[4];
                const indexTip = lm[8];
                const distance = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y, thumbTip.z - indexTip.z);

                const now = Date.now();
                if (distance < 0.06) { // 엄지-검지를 꼬집었을 때
                    if (!isPinching && (now - lastPinchTime > 800)) {
                        isPinching = true;
                        lastPinchTime = now;

                        // 시선이 머문 곳에서 Pinch 발생 시 실행
                        if (hoveredApp && !isAppOpen) {
                            openApp(hoveredApp.userData.name, hoveredApp.userData.url);
                        }
                    }
                } else {
                    isPinching = false;
                }
            } else {
                statusTag.innerText = "손을 카메라 앞으로 가져오세요";
            }
        }

        function openApp(name, url) {
            isAppOpen = true;
            windowTitle.innerText = name;
            glassPanel.visible = false;
            appIcons.forEach(icon => icon.visible = false);

            if (url && url !== "#") {
                appIframe.src = url;
            } else {
                appIframe.srcdoc = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#111;color:#fff;font-family:sans-serif;"><h2>${name} App Active</h2></div>`;
            }
            appWindow.style.display = 'flex';
            keyboard.style.display = 'flex';
        }

        function closeApp() {
            isAppOpen = false;
            appWindow.style.display = 'none';
            keyboard.style.display = 'none';
            appIframe.src = "about:blank";
            glassPanel.visible = true;
            appIcons.forEach(icon => icon.visible = true);
        }

        function toggleKeyboard(show) {
            keyboard.style.display = show ? 'flex' : 'none';
        }

        function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });
            hands.onResults(onHandResults);
        }
    </script>
</body>
</html>
