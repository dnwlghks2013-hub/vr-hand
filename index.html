<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cardboard VR YouTube Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #webcam { display: none; }
        #container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 999; padding: 20px 40px; font-size: 20px; font-weight: bold;
            color: #fff; background: #28a745; border: none; border-radius: 10px; cursor: pointer;
        }
        /* VR 화면 오버레이 레이어 */
        .vr-screen-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; gap: 20px; z-index: 10; pointer-events: none;
        }
        .screen-box {
            width: 45vw; height: 70vh; background: #111;
            border: 2px solid #444; border-radius: 10px; overflow: hidden;
            pointer-events: auto;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <button id="start-btn" onclick="startVR()">VR 시작 (터치하여 화면 열기)</button>
    <video id="webcam" playsinline></video>
    <div id="container"></div>

    <!-- 좌우 입체 VR 유튜브 화면 -->
    <div class="vr-screen-container" id="vr-ui" style="display: none;">
        <div class="screen-box">
            <iframe src="https://www.youtube.com/embed/?listType=playlist&list=PLrAXtmErZgOdP_8Gzs0fLRE5fBvM0w1S4" allowfullscreen></iframe>
        </div>
        <div class="screen-box">
            <iframe src="https://www.youtube.com/embed/?listType=playlist&list=PLrAXtmErZgOdP_8Gzs0fLRE5fBvM0w1S4" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        let scene, camera, renderer, cursorMesh;
        const videoElement = document.getElementById('webcam');
        const container = document.getElementById('container');
        const startBtn = document.getElementById('start-btn');
        const vrUi = document.getElementById('vr-ui');

        function startVR() {
            startBtn.style.display = 'none';
            vrUi.style.display = 'flex';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            initThree();
            initCamera();
            render();
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 손가락 추적 초록색 커서
            const cursorGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const cursorMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
            scene.add(cursorMesh);
        }

        function render() {
            requestAnimationFrame(render);
            const w = window.innerWidth;
            const h = window.innerHeight;

            renderer.setScissorTest(true);

            // 좌측 눈 렌더링
            renderer.setViewport(0, 0, w / 2, h);
            renderer.setScissor(0, 0, w / 2, h);
            camera.aspect = (w / 2) / h;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);

            // 우측 눈 렌더링
            renderer.setViewport(w / 2, 0, w / 2, h);
            renderer.setScissor(w / 2, 0, w / 2, h);
            renderer.render(scene, camera);

            renderer.setScissorTest(false);
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];

                const x = (0.5 - indexTip.x) * 6;
                const y = (0.5 - indexTip.y) * 4;
                cursorMesh.position.set(x, y, -2.5);
            }
        }

        async function initCamera() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                facingMode: 'environment',
                width: 640,
                height: 480
            });

            cameraUtils.start();
        }
    </script>
</body>
</html>
