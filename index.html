<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vision Pro AR - Safe Hand Tracking</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        .camera-container {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; z-index: 1;
        }
        .cam-view { width: 50vw; height: 100vh; overflow: hidden; }
        .cam-view video { width: 100%; height: 100%; object-fit: cover; }

        #container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0;
            z-index: 2; pointer-events: none;
        }

        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 999; padding: 20px 40px; font-size: 20px; font-weight: bold;
            color: #fff; background: #007aff; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }

        #error-msg {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #ff4d4d; background: rgba(0,0,0,0.8); padding: 10px 20px;
            border-radius: 8px; font-size: 14px; z-index: 1000; display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <button id="start-btn" onclick="startVisionAR()">비전프로 AR 실행</button>
    <div id="error-msg"></div>

    <div class="camera-container">
        <div class="cam-view"><video id="webcam-left" autoplay playsinline muted></video></div>
        <div class="cam-view"><video id="webcam-right" autoplay playsinline muted></video></div>
    </div>

    <div id="container"></div>

    <script>
        let scene, camera, renderer;
        const joints = [];
        let skeletonLines = [];
        const appIcons = [];
        
        let isAppVisible = false;
        let lastFistState = false;

        const videoLeft = document.getElementById('webcam-left');
        const videoRight = document.getElementById('webcam-right');
        const container = document.getElementById('container');
        const startBtn = document.getElementById('start-btn');
        const errorMsg = document.getElementById('error-msg');

        const HAND_CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],
            [0,5], [5,6], [6,7], [7,8],
            [5,9], [9,10], [10,11], [11,12],
            [9,13], [13,14], [14,15], [15,16],
            [13,17], [0,17], [17,18], [18,19], [19,20]
        ];

        const appsData = [
            { name: "Safari", color: 0x007aff },
            { name: "Photos", color: 0xff3b30 },
            { name: "Music", color: 0xff2d55 },
            { name: "TV", color: 0x5856d6 },
            { name: "Settings", color: 0x8e8e93 },
            { name: "Notes", color: 0xffcc00 }
        ];

        async function startVisionAR() {
            startBtn.style.display = 'none';

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                }
            } catch (e) {
                console.warn("전체화면 적용 불가:", e);
            }

            initThree();
            await initCamera();
            render();
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            createAppGrid();

            const jointGeo = new THREE.SphereGeometry(0.06, 12, 12);
            const jointMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            for (let i = 0; i < 21; i++) {
                const joint = new THREE.Mesh(jointGeo, jointMat);
                joint.visible = false;
                scene.add(joint);
                joints.push(joint);
            }

            const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            HAND_CONNECTIONS.forEach(() => {
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
                const line = new THREE.Line(geometry, lineMat);
                line.visible = false;
                scene.add(line);
                skeletonLines.push(line);
            });
        }

        function createAppGrid() {
            const cols = 3;
            const spacingX = 1.3;
            const spacingY = 1.2;

            appsData.forEach((app, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);

                const iconGeo = new THREE.CircleGeometry(0.4, 32);
                const iconMat = new THREE.MeshBasicMaterial({ 
                    color: app.color, 
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.85
                });
                const mesh = new THREE.Mesh(iconGeo, iconMat);

                const posX = (col - 1) * spacingX;
                const posY = 0.6 - (row * spacingY);
                mesh.position.set(posX, posY, -1.0);
                mesh.visible = false;

                scene.add(mesh);
                appIcons.push(mesh);
            });
        }

        function render() {
            requestAnimationFrame(render);
            const w = window.innerWidth;
            const h = window.innerHeight;

            renderer.setScissorTest(true);

            // 좌측 눈
            renderer.setViewport(0, 0, w / 2, h);
            renderer.setScissor(0, 0, w / 2, h);
            camera.aspect = (w / 2) / h;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);

            // 우측 눈
            renderer.setViewport(w / 2, 0, w / 2, h);
            renderer.setScissor(w / 2, 0, w / 2, h);
            renderer.render(scene, camera);

            renderer.setScissorTest(false);
        }

        function checkIsFist(landmarks) {
            const indexFolded = landmarks[8].y > landmarks[6].y;
            const middleFolded = landmarks[12].y > landmarks[10].y;
            const ringFolded = landmarks[16].y > landmarks[14].y;
            const pinkyFolded = landmarks[20].y > landmarks[18].y;

            return indexFolded && middleFolded && ringFolded && pinkyFolded;
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                landmarks.forEach((lm, index) => {
                    const x = (0.5 - lm.x) * 6;
                    const y = (0.5 - lm.y) * 4;
                    const z = -lm.z * 5 - 1.0;

                    joints[index].position.set(x, y, z);
                    joints[index].visible = true;
                });

                HAND_CONNECTIONS.forEach((pair, index) => {
                    const p1 = joints[pair[0]].position;
                    const p2 = joints[pair[1]].position;

                    const positions = skeletonLines[index].geometry.attributes.position.array;
                    positions[0] = p1.x; positions[1] = p1.y; positions[2] = p1.z;
                    positions[3] = p2.x; positions[4] = p2.y; positions[5] = p2.z;

                    skeletonLines[index].geometry.attributes.position.needsUpdate = true;
                    skeletonLines[index].visible = true;
                });

                const isFist = checkIsFist(landmarks);

                if (isFist && !lastFistState) {
                    isAppVisible = !isAppVisible;
                    appIcons.forEach(icon => icon.visible = isAppVisible);
                }
                lastFistState = isFist;

            } else {
                joints.forEach(j => j.visible = false);
                skeletonLines.forEach(l => l.visible = false);
            }
        }

        async function initCamera() {
            let stream = null;
            
            // 카메라 요청 (후면 시도 후 실패 시 기본 카메라 적용)
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (fallbackErr) {
                    errorMsg.innerText = "카메라를 연결할 수 없습니다. 권한 설정을 확인해주세요.";
                    errorMsg.style.display = "block";
                    return;
                }
            }

            videoLeft.srcObject = stream;
            videoRight.srcObject = stream;

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            const cameraUtils = new Camera(videoLeft, {
                onFrame: async () => {
                    await hands.send({ image: videoLeft });
                },
                width: 640,
                height: 480
            });

            cameraUtils.start();
        }
    </script>
</body>
</html>
