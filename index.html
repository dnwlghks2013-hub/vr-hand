<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardboard VR YouTube & Web Browser</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #webcam { display: none; }
        #vr-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* VR 내부 UI 오버레이 레이어 */
        .ui-panel {
            position: absolute;
            width: 500px;
            height: 300px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #555;
            border-radius: 10px;
            color: white;
            padding: 10px;
            box-sizing: border-box;
        }
        iframe { width: 100%; height: 220px; border: none; }
        .keyboard { display: flex; gap: 5px; margin-top: 5px; }
        .key-btn {
            background: #444; color: white; border: none;
            padding: 8px 12px; border-radius: 4px; font-weight: bold;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="webcam" playsinline></video>
    <div id="vr-container"></div>

    <script>
        let scene, camera, renderer, cursorMesh;
        let isPinching = false;
        const videoElement = document.getElementById('webcam');
        const container = document.getElementById('vr-container');

        // 1. Three.js 환경 구축
        function initVR() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, (window.innerWidth / 2) / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // 손가락 위치 커서 (초록색 구체)
            const cursorGeo = new THREE.SphereGeometry(0.08, 16, 16);
            const cursorMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            cursorMesh = new THREE.Mesh(cursorGeo, cursorMat);
            scene.add(cursorMesh);

            // 3D 공간 내 유튜브 캔버스 판넬 생성
            createVirtualBrowser();
        }

        // 2. VR 공간 내 유튜브 브라우저 화면 생성
        function createVirtualBrowser() {
            // 유튜브 영상을 텍스처로 가지는 Plane 생성
            const textureLoader = new THREE.TextureLoader();
            
            // 3D 입체 브라우저 보드
            const boardGeo = new THREE.PlaneGeometry(4, 2.25);
            const boardMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });
            const board = new THREE.Mesh(boardGeo, boardMat);
            board.position.set(0, 0.5, -3);
            scene.add(board);
        }

        // 3. VR Side-by-Side 렌더링
        function render() {
            requestAnimationFrame(render);

            const w = window.innerWidth;
            const h = window.innerHeight;

            renderer.setScissorTest(true);

            // 좌측 눈
            renderer.setViewport(0, 0, w / 2, h);
            renderer.setScissor(0, 0, w / 2, h);
            camera.aspect = (w / 2) / h;
            camera.updateProjectionMatrix();
            renderer.render(scene, camera);

            // 우측 눈
            renderer.setViewport(w / 2, 0, w / 2, h);
            renderer.setScissor(w / 2, 0, w / 2, h);
            renderer.render(scene, camera);

            renderer.setScissorTest(false);
        }

        // 4. 손동작 인식 & 가상 마우스 클릭 처리
        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                const indexTip = landmarks[8]; // 검지 끝
                const thumbTip = landmarks[4]; // 엄지 끝

                // 검지 손가락 위치를 3D 공간으로 좌표 변환
                const x = (0.5 - indexTip.x) * 6;
                const y = (0.5 - indexTip.y) * 4;
                const z = -2.5;

                cursorMesh.position.set(x, y, z);

                // 핀치 거리 계산 (엄지-검지 맞닿음)
                const distance = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);

                if (distance < 0.06) {
                    if (!isPinching) {
                        isPinching = true;
                        cursorMesh.material.color.setHex(0xff0000); // 핀치 시 빨간색 변경 (클릭 효과)
                        triggerVirtualClick(indexTip.x, indexTip.y);
                    }
                } else {
                    isPinching = false;
                    cursorMesh.material.color.setHex(0x00ff00);
                }
            }
        }

        // 손가락 위치를 이용한 가상 화면 클릭 조작
        function triggerVirtualClick(screenX, screenY) {
            const absoluteX = screenX * window.innerWidth;
            const absoluteY = screenY * window.innerHeight;

            const elem = document.elementFromPoint(absoluteX, absoluteY);
            if (elem) {
                elem.click();
            }
        }

        // 5. 카메라 세팅
        async function initCamera() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                facingMode: 'environment',
                width: 640,
                height: 480
            });

            cameraUtils.start();
        }

        initVR();
        initCamera();
        render();
    </script>
</body>
</html>
